name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image and cache
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: notiq-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests with Docker Compose
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
        run: |
          # Use docker compose to run the test suite
          # It relies on the build context so it will pick up the cached layers automatically
          docker compose --profile test up --build --abort-on-container-exit --exit-code-from test
          
      - name: Post Coverage Summary to PR
        if: github.event_name == 'pull_request'
        run: |
          # The pytest run will output coverage to stdout. 
          # We extract the short text table from the logs or use an action.
          # To keep it simple, we use a widely used coverage reporter action:
          # (Assuming coverage.xml is generated if we add --cov-report=xml)
          docker compose --profile test run --rm test pytest --cov=src --cov-report=xml
          
      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
            coverageFile: coverage.xml
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up test containers
        if: always()
        run: docker compose --profile test down -v --remove-orphans
