[pytest]
asyncio_mode = auto
addopts = --strict-markers -v
testpaths = tests
pythonpath = .
env =
    ENVIRONMENT=test
    POSTGRES_DB=notiq_test
    POSTGRES_USER=postgres
    POSTGRES_PASSWORD=postgres
    POSTGRES_HOST=localhost
    POSTGRES_PORT=5432
    REDIS_URL=redis://localhost:6379/1
    METRICS_BACKEND=memory
    WORKER_ID=test-worker
